[project]
name = "cfs"
version = "0.1.0"
description = "Curriculum Flight Simulator — API, domain, and worker code"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "networkx>=3.3",
  "celery[redis,sqs]>=5.4",
  "redis>=5.0",
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "pyyaml>=6.0",
  "boto3>=1.35",
  "python-multipart>=0.0.9",
  "markdown>=3.7",
  "openai>=3.19.2",
  "anthropic>=1.8.0",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "moto[s3]>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfs"]

[tool.pytest.ini_options]
testpaths = ["../../tests/api"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"cfs/ai/assistant.py" = ["E501"]  # prompt text
