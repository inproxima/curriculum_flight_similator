name: cfs
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cfs
      POSTGRES_PASSWORD: cfs
      POSTGRES_DB: cfs
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfs -d cfs"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    env_file: [../.env]
    environment:
      CFS_DATABASE_URL: postgresql+psycopg://cfs:cfs@db:5432/cfs
      CFS_BROKER_URL: redis://redis:6379/0
      CFS_STORAGE_ROOT: /data/objects
      CFS_BIND_HOST: 0.0.0.0
    command: sh -c "alembic upgrade head && uvicorn cfs.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/cfs"
    ports: ["127.0.0.1:8010:8000"]
    volumes:
      - ../services/api/cfs:/app/cfs
      - ../services/api/alembic:/app/alembic
      - ../fixtures:/fixtures:ro
      - ../data/objects:/data/objects
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    env_file: [../.env]
    environment:
      CFS_DATABASE_URL: postgresql+psycopg://cfs:cfs@db:5432/cfs
      CFS_BROKER_URL: redis://redis:6379/0
      CFS_STORAGE_ROOT: /data/objects
    command: celery -A cfs_worker.app worker --loglevel=INFO --concurrency=2
    volumes:
      - ../services/api/cfs:/app/cfs
      - ../services/worker/cfs_worker:/app/cfs_worker
      - ../data/objects:/data/objects
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_started }

  web:
    image: node:24-alpine
    working_dir: /app/apps/web
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - webmodules:/app/apps/web/node_modules
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  webmodules:
