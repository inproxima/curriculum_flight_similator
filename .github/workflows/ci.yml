name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cfs
          POSTGRES_PASSWORD: cfs
          POSTGRES_DB: cfs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cfs -d cfs_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CFS_ENV: test
      CFS_DATABASE_URL: postgresql+psycopg://cfs:cfs@localhost:5432/cfs_test
      CFS_TASK_ALWAYS_EAGER: "true"
      CFS_STORAGE_ROOT: /tmp/cfs-objects
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - uses: astral-sh/setup-uv@v6
      - working-directory: services/api
        run: uv sync --frozen
      - working-directory: services/api
        run: uv run ruff check cfs ../../tests/api && uv run ruff format --check cfs ../../tests/api
      - working-directory: services/api
        run: uv run pytest -q
      - name: OpenAPI contract is up to date
        working-directory: services/api
        run: |
          uv run python -m cfs.openapi_dump /tmp/openapi.json
          diff -q /tmp/openapi.json ../../packages/contracts/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -p . --noEmit
      - run: pnpm test
      - run: pnpm build

  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: false
          tags: cfs-api:ci
